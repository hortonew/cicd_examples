name: Kustomize Diff

# ============ TOGGLE ============
env:
    ENABLE_KUBECONFORM: "true" # Set to 'false' to disable validation
    KUBECONFORM_VERSION: "0.7.0"
# ================================

on:
    pull_request:
        branches: [main]
        paths:
            - "configs/k8s/kustomize/**"

jobs:
    detect-changes:
        name: Detect Changed Environments
        runs-on: ubuntu-latest
        outputs:
            environments: ${{ steps.detect.outputs.environments }}
            changed_files: ${{ steps.detect.outputs.changed_files }}
        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Detect which environments changed
              id: detect
              run: |
                  chmod +x .github/scripts/detect-changes.sh
                  .github/scripts/detect-changes.sh configs/k8s/kustomize

    diff:
        name: Kustomize Diff
        runs-on: ubuntu-latest
        needs: detect-changes
        if: needs.detect-changes.outputs.environments != ''
        permissions:
            pull-requests: write
        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v6
              with:
                  path: pr

            - name: Checkout main branch
              uses: actions/checkout@v6
              with:
                  ref: main
                  path: main

            - name: Cache kubeconform
              if: env.ENABLE_KUBECONFORM == 'true'
              id: cache-kubeconform
              uses: actions/cache@v5
              with:
                  path: /usr/local/bin/kubeconform
                  key: kubeconform-${{ env.KUBECONFORM_VERSION }}

            - name: Install kubeconform
              if: env.ENABLE_KUBECONFORM == 'true' && steps.cache-kubeconform.outputs.cache-hit != 'true'
              run: |
                  curl -sSL https://github.com/yannh/kubeconform/releases/download/v${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz | tar xz
                  sudo mv kubeconform /usr/local/bin/

            - name: Kubeconform Validate
              if: env.ENABLE_KUBECONFORM == 'true'
              id: validate
              run: |
                  chmod +x pr/.github/scripts/kubeconform-validate.sh
                  pr/.github/scripts/kubeconform-validate.sh "${{ needs.detect-changes.outputs.environments }}"

            - name: Generate diffs
              id: diff
              run: |
                  chmod +x pr/.github/scripts/kustomize-diff.sh
                  pr/.github/scripts/kustomize-diff.sh "${{ needs.detect-changes.outputs.environments }}"

            - name: Comment on PR
              uses: actions/github-script@v8
              with:
                  script: |
                      const script = require('./pr/.github/scripts/comment-on-pr.js')
                      await script({
                        github,
                        context,
                        core,
                        inputs: {
                          environments: '${{ needs.detect-changes.outputs.environments }}',
                          changedFiles: '${{ needs.detect-changes.outputs.changed_files }}',
                          kubeconformEnabled: '${{ env.ENABLE_KUBECONFORM }}' === 'true',
                          validationFailed: '${{ steps.validate.outputs.failed }}' === 'true'
                        }
                      })

            - name: Fail if validation failed
              if: env.ENABLE_KUBECONFORM == 'true' && steps.validate.outputs.failed == 'true'
              run: |
                  echo "❌ Manifest validation failed!"
                  exit 1
