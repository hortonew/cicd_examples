name: Kustomize Diff

# ============ TOGGLE ============
env:
    ENABLE_KUBECONFORM: "true" # Set to 'false' to disable validation
    KUBECONFORM_VERSION: "0.7.0"
# ================================

on:
    pull_request:
        branches: [main]
        paths:
            - "configs/k8s/kustomize/**"

jobs:
    detect-changes:
        name: Detect Changed Environments
        runs-on: ubuntu-latest
        outputs:
            environments: ${{ steps.detect.outputs.environments }}
        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v6
              with:
                  fetch-depth: 0

            - name: Detect which environments changed
              id: detect
              run: |
                  CHANGED_FILES=$(git diff --name-only origin/main...HEAD -- configs/k8s/kustomize/)
                  echo "Changed files:"
                  echo "$CHANGED_FILES"

                  # Get all environment names from overlays folder
                  ALL_ENVS=$(ls -1 configs/k8s/kustomize/overlays/ | xargs)
                  echo "Available environments: $ALL_ENVS"

                  ENVS=""

                  # If base changed, all environments are affected
                  if echo "$CHANGED_FILES" | grep -q "configs/k8s/kustomize/base/"; then
                    ENVS="$ALL_ENVS"
                  else
                    # Check each overlay dynamically
                    for env in $ALL_ENVS; do
                      if echo "$CHANGED_FILES" | grep -q "configs/k8s/kustomize/overlays/$env/"; then
                        ENVS="$ENVS $env"
                      fi
                    done
                  fi

                  ENVS=$(echo "$ENVS" | xargs)
                  echo "Environments to diff: $ENVS"
                  echo "environments=$ENVS" >> $GITHUB_OUTPUT

    diff:
        name: Kustomize Diff
        runs-on: ubuntu-latest
        needs: detect-changes
        if: needs.detect-changes.outputs.environments != ''
        permissions:
            pull-requests: write
        steps:
            - name: Checkout PR branch
              uses: actions/checkout@v6
              with:
                  path: pr

            - name: Checkout main branch
              uses: actions/checkout@v6
              with:
                  ref: main
                  path: main

            - name: Cache kubeconform
              if: env.ENABLE_KUBECONFORM == 'true'
              id: cache-kubeconform
              uses: actions/cache@v5
              with:
                  path: /usr/local/bin/kubeconform
                  key: kubeconform-${{ env.KUBECONFORM_VERSION }}

            - name: Install kubeconform
              if: env.ENABLE_KUBECONFORM == 'true' && steps.cache-kubeconform.outputs.cache-hit != 'true'
              run: |
                  curl -sSL https://github.com/yannh/kubeconform/releases/download/v${{ env.KUBECONFORM_VERSION }}/kubeconform-linux-amd64.tar.gz | tar xz
                  sudo mv kubeconform /usr/local/bin/

            - name: Kubeconform Validate
              if: env.ENABLE_KUBECONFORM == 'true'
              id: validate
              run: |
                  ENVS="${{ needs.detect-changes.outputs.environments }}"
                  VALIDATION=""
                  VALIDATION_FAILED=false

                  for env in $ENVS; do
                    echo "Validating $env..."
                    OUTPUT=$(kubectl kustomize pr/configs/k8s/kustomize/overlays/$env | kubeconform -summary -output json 2>&1) || true

                    # Check for errors (statusInvalid or invalid)
                    if echo "$OUTPUT" | grep -qiE '"status":\s*"(invalid|statusInvalid)"'; then
                      VALIDATION_FAILED=true
                      VALIDATION="$VALIDATION
                  <details>
                  <summary>❌ <strong>$env</strong> - validation failed</summary>

                  \`\`\`json
                  $OUTPUT
                  \`\`\`

                  </details>
                  "
                    else
                      VALIDATION="$VALIDATION
                  <details>
                  <summary>✅ <strong>$env</strong> - valid</summary>

                  \`\`\`json
                  $OUTPUT
                  \`\`\`

                  </details>
                  "
                    fi
                  done

                  echo "$VALIDATION" > validation_output.md
                  echo "failed=$VALIDATION_FAILED" >> $GITHUB_OUTPUT

            - name: Generate diffs
              id: diff
              run: |
                  ENVS="${{ needs.detect-changes.outputs.environments }}"
                  DIFF=""

                  for env in $ENVS; do
                    echo "Diffing $env..."
                    MAIN_OUTPUT=$(kubectl kustomize main/configs/k8s/kustomize/overlays/$env 2>&1 || echo "Error building main")
                    PR_OUTPUT=$(kubectl kustomize pr/configs/k8s/kustomize/overlays/$env 2>&1 || echo "Error building PR")
                    
                    ENV_DIFF=$(diff -u --label main --label pr <(echo "$MAIN_OUTPUT") <(echo "$PR_OUTPUT") || true)

                    if [ -n "$ENV_DIFF" ]; then
                      # Count additions and removals separately
                      ADDITIONS=$(echo "$ENV_DIFF" | grep -cE '^\+[^+]' || echo 0)
                      REMOVALS=$(echo "$ENV_DIFF" | grep -cE '^-[^-]' || echo 0)
                      DIFF="$DIFF
                  <details>
                  <summary><strong>$env</strong> (+$ADDITIONS, -$REMOVALS)</summary>

                  \`\`\`diff
                  $ENV_DIFF
                  \`\`\`

                  </details>
                  "
                    else
                      DIFF="$DIFF
                  <details>
                  <summary><strong>$env</strong> (no changes)</summary>

                  No changes detected.

                  </details>
                  "
                    fi
                  done

                  # Write to file for the comment step
                  echo "$DIFF" > diff_output.md

            - name: Comment on PR
              uses: actions/github-script@v8
              with:
                  script: |
                      const fs = require('fs');
                      const diff = fs.readFileSync('diff_output.md', 'utf8');
                      const envs = '${{ needs.detect-changes.outputs.environments }}'.split(' ').join(', ');
                      const kubeconformEnabled = '${{ env.ENABLE_KUBECONFORM }}' === 'true';

                      let validationSection = '';
                      if (kubeconformEnabled) {
                        const validation = fs.readFileSync('validation_output.md', 'utf8');
                        const validationFailed = '${{ steps.validate.outputs.failed }}' === 'true';
                        validationSection = `### Validation ${validationFailed ? '❌' : '✅'}\n\n${validation}\n\n`;
                      }

                      const body = `## Kustomize Diff

                      Environments affected: \`${envs}\`

                      ${validationSection}### Changes

                      ${diff}
                      `;

                      // Find existing comment
                      const { data: comments } = await github.rest.issues.listComments({
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        issue_number: context.issue.number,
                      });

                      const botComment = comments.find(c => 
                        c.user.type === 'Bot' && c.body.includes('## Kustomize Diff')
                      );

                      if (botComment) {
                        await github.rest.issues.updateComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          comment_id: botComment.id,
                          body: body
                        });
                      } else {
                        await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body: body
                        });
                      }

            - name: Fail if validation failed
              if: env.ENABLE_KUBECONFORM == 'true' && steps.validate.outputs.failed == 'true'
              run: |
                  echo "❌ Manifest validation failed!"
                  exit 1
